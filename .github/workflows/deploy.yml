name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/notes-app-510404/notes-repo/notes-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/298917105221/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@notes-app-510404.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: notes-cluster
          location: us-central1

      - run: |
          kubectl apply -f k8s/
          kubectl set image deployment/notes-app notes-app=$IMAGE
          kubectl rollout status deployment/notes-app --timeout=180s